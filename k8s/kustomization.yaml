# Kustomize is built into kubectl (`kubectl apply -k k8s/`). ArgoCD auto-detects
# this file in Stage 4 and uses it as the sync source, so the same directory
# drives both the manual and GitOps paths.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ci-triage

resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  # The ENCRYPTED secret. Safe to commit: only the in-cluster controller holds
  # the private key. The controller unseals it into a normal Secret named
  # ci-triage-secrets, which deployment.yaml reads unchanged.
  - sealedsecret.yaml
  # secret.example.yaml is deliberately NOT listed -- it is a template, and
  # applying it would overwrite the real Secret with a placeholder key.

# `commonLabels` is deprecated; `labels` with includeSelectors is the replacement.
# The image, in ONE place. CI rewrites `newTag` on every backend commit and
# commits the change; ArgoCD sees the new commit and rolls it out.
#
# `newTag` is an immutable sha-<commit> tag, which is the entire point of
# Stage 5: the Deployment spec genuinely changes on every deploy, so there is
# no `rollout restart` to remember and no way to be wrong about what is
# running. The placeholder below is replaced by the first CI run.
images:
  - name: ci-triage-bot
    newName: ghcr.io/williamdjting/ci-triage-bot
    newTag: sha-5279906

labels:
  - pairs:
      app.kubernetes.io/name: ci-triage-bot
      app.kubernetes.io/part-of: ci-triage-bot
    includeSelectors: false
