# TEMPLATE ONLY -- safe to commit. The real Secret is created out-of-band and is
# gitignored (see k8s/README.md).
#
# Committing a real key here would be the classic GitOps mistake: Kubernetes
# Secrets are base64, which is encoding, NOT encryption. Anyone with repo read
# access can decode it with `base64 -d`.
#
# Stage 4 forces a proper answer to this, since ArgoCD syncs FROM git and can
# only manage what lives there. The two standard fixes:
#   - Sealed Secrets  -- encrypt with a cluster public key; only the in-cluster
#                        controller can decrypt. The encrypted blob IS committed.
#   - External Secrets Operator -- keep the value in Vault/AWS Secrets Manager;
#                        git holds only a pointer to it.
apiVersion: v1
kind: Secret
metadata:
  name: ci-triage-secrets
  namespace: ci-triage
type: Opaque
stringData:
  OPENROUTER_API_KEY: "sk-or-REPLACE_ME"
  OPENROUTER_MODEL: "openai/gpt-4o-mini"
