name: ci

# Only backend changes rebuild the image. This path filter is also the
# loop-breaker: the bump job below commits to k8s/, and if that path triggered
# this workflow, every build would trigger another build forever.
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/ci-triage-bot

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      tag: ${{ steps.tag.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Compute immutable tag
        id: tag
        # sha-<short commit>. The whole point of Stage 5: this string changes on
        # every commit, so the Deployment spec genuinely changes and Kubernetes
        # has a real reason to roll. `:local` never did.
        run: echo "tag=sha-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      # Emulation for cross-building the arm64 image. GitHub runners are amd64;
      # Apple Silicon kind nodes are arm64, so an amd64-only image fails to pull
      # with "no match for platform in manifest".
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Build image (load locally for the smoke test)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          # Single-platform on purpose: `load: true` cannot load a multi-arch
          # manifest into the local daemon, and the smoke test only needs to run
          # on the runner's native arch.
          load: true
          tags: ci-triage-bot:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        # Catches a broken image BEFORE it is published, rather than after
        # ArgoCD has already rolled it into the cluster. No API key needed --
        # /healthz deliberately does no I/O.
        run: |
          docker run -d --name smoke -p 8000:8000 \
            -e OPENROUTER_API_KEY=dummy-not-used ci-triage-bot:test
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/healthz || true)
            [ "$code" = "200" ] && break
            sleep 1
          done
          echo "GET /healthz -> $code"
          [ "$code" = "200" ] || { docker logs smoke; exit 1; }
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/)" = "200" ] \
            || { docker logs smoke; exit 1; }
          # Must not be running as root.
          [ "$(docker exec smoke id -u)" = "10001" ] || { echo "not running as uid 10001"; exit 1; }
          docker rm -f smoke

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          # Must cover every architecture that will run this image. amd64 for
          # cloud runners and Intel Macs, arm64 for Apple Silicon kind nodes.
          platforms: linux/amd64,linux/arm64
          # `latest` is a convenience for humans only. Nothing deploys from it --
          # a mutable tag is exactly the trap this stage exists to remove.
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha

  bump:
    # The GitOps handoff. CI does not deploy anything and has no cluster
    # credentials -- it writes the new tag to git, and ArgoCD (which is watching
    # this repo) notices and rolls it out. CI pushes images; ArgoCD deploys.
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Point the manifest at the new tag
        run: |
          set -euo pipefail
          TAG="${{ needs.build.outputs.tag }}"
          # Rewrite only the newTag line inside the images: block.
          python3 - "$TAG" <<'PY'
          import re, sys
          from pathlib import Path
          tag = sys.argv[1]
          p = Path("k8s/kustomization.yaml")
          s = p.read_text()
          new, n = re.subn(r'(\n    newTag: ).*', r'\g<1>' + tag, s, count=1)
          if n != 1:
              sys.exit(f"expected exactly one newTag line, patched {n}")
          p.write_text(new)
          print(f"newTag -> {tag}")
          PY

      - name: Commit and push
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "manifest already at this tag, nothing to commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/kustomization.yaml
          git commit -m "chore(deploy): ${{ needs.build.outputs.tag }}"
          git pull --rebase origin main
          git push origin main
