# Local development entrypoint. This is the "does the container work at all?"
# layer -- Kubernetes and Terraform sit on top of the exact same image.
services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ci-triage-bot:local
    ports:
      - "8000:8000"
    environment:
      # Injected from your shell or the .env file below -- never baked into the
      # image. The ":?" makes compose fail loudly instead of starting a container
      # that only breaks once you click Analyze.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?set OPENROUTER_API_KEY in .env}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-4o-mini}
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2).status == 200 else 1)"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
